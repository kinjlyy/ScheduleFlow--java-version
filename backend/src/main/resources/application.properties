# =============================================================================
#  ScheduleFlow Timetable Service — Application Configuration
#  All values are driven by environment variables with sensible local defaults.
#  DO NOT hardcode secrets in this file.
# =============================================================================

# ── Service Identity ───────────────────────────────────────────────────────────
spring.application.name=TIMETABLE-SERVICE
server.port=${PORT:8080}

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ─────────────────────────────────────────────────────────────────────
# baseline-on-migrate=true: marks the existing schema as V1 on first Flyway run
# so that V2+ migrations apply without Flyway trying to recreate existing tables.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.onrender.com}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.scheduleflow=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# ── Scheduler Configuration ────────────────────────────────────────────────────
scheduler.max-compaction-passes=${SCHEDULER_MAX_COMPACTION_PASSES:50}

# ── Spring Boot Actuator ───────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.info.app.name=ScheduleFlow Timetable Service
management.info.app.version=1.0.0
management.info.app.description=Microservice responsible for timetable generation, versioning, and lecture history

# ── Service Discovery (Eureka Client) ──────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# Hostname-based registration for cloud/Render container routing
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_PORT:${PORT:8080}}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}
