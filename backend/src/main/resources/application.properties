# =============================================================================
#  ScheduleFlow Timetable Service — Application Configuration
#  All values are driven by environment variables with sensible local defaults.
#  DO NOT hardcode secrets in this file.
# =============================================================================

# ── Service Identity ───────────────────────────────────────────────────────────
spring.application.name=TIMETABLE-SERVICE
server.port=${PORT:8080}

# ── Database ───────────────────────────────────────────────────────────────────
# DATABASE_URL, DB_USER and DB_PASS are supplied via:
#   Local dev  → backend/.env  (gitignored)
#   Production → Render environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins (in addition to localhost defaults)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.scheduleflow=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

# ── Scheduler Configuration ────────────────────────────────────────────────────
# Maximum number of compaction passes in the timetable optimizer
scheduler.max-compaction-passes=${SCHEDULER_MAX_COMPACTION_PASSES:50}

# ── Spring Boot Actuator ───────────────────────────────────────────────────────
# Expose health, info, and readiness endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.endpoint.health.probes.enabled=true
management.info.app.name=ScheduleFlow Timetable Service
management.info.app.version=1.0.0
management.info.app.description=Microservice responsible for timetable generation, versioning, and lecture history

# ── Service Discovery (Eureka Client) ──────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
