# =============================================================================
#  ScheduleFlow Resource Service — Application Configuration
#  All values driven by environment variables with local defaults.
# =============================================================================

# ── Service Identity ───────────────────────────────────────────────────────────
spring.application.name=RESOURCE-SERVICE
server.port=${PORT:8081}

# ── Database Configuration (Dedicated Resource DB) ────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scheduleflow_resource}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.scheduleflow.resource=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}

# ── Service Discovery (Eureka Client) ──────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── Spring Boot Actuator ───────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.info.app.name=ScheduleFlow Resource Service
management.info.app.version=1.0.0
management.info.app.description=Microservice managing rooms, labs, auditoriums, and physical resources
