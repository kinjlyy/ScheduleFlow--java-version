# =============================================================================
# ScheduleFlow API Gateway — Application Configuration
# =============================================================================

spring.application.name=API-GATEWAY
server.port=${PORT:8082}

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_PORT:${PORT:8082}}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# ── CORS ──────────────────────────────────────────────────────────────────────
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# IMPORTANT: Disable discovery locator when using explicit URLs
spring.cloud.gateway.discovery.locator.enabled=false

# ── Resource Service ──────────────────────────────────────────────────────────
spring.cloud.gateway.routes[0].id=resource-service-route
spring.cloud.gateway.routes[0].uri=${RESOURCE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/rooms,/api/rooms/**

# ── Timetable Service ─────────────────────────────────────────────────────────
spring.cloud.gateway.routes[1].id=timetable-service-route
spring.cloud.gateway.routes[1].uri=${TIMETABLE_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/timetables,/api/timetables/**,/api/generate,/api/generate/**,/api/lectures,/api/lectures/**,/api/auth/**,/api/health

# ── Event Service ─────────────────────────────────────────────────────────────
spring.cloud.gateway.routes[2].id=event-service-route
spring.cloud.gateway.routes[2].uri=${EVENT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/events,/api/events/**