# =============================================================================
#  ScheduleFlow API Gateway — Application Configuration
#  All values are driven by environment variables with sensible local defaults.
# =============================================================================

# ── Service Identity ───────────────────────────────────────────────────────────
spring.application.name=API-GATEWAY
server.port=${PORT:8082}

# ── Service Discovery (Eureka Client) ──────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── Spring Cloud Gateway Route Configuration ──────────────────────────────────
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Dynamic Route 1: Explicit routing for Room Resources -> RESOURCE-SERVICE
spring.cloud.gateway.routes[0].id=resource-service-route
spring.cloud.gateway.routes[0].uri=lb://RESOURCE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/rooms/**

# Dynamic Route 2: Explicit routing for Timetable Core APIs -> TIMETABLE-SERVICE
spring.cloud.gateway.routes[1].id=timetable-service-route
spring.cloud.gateway.routes[1].uri=lb://TIMETABLE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/timetables/**, /api/generate/**, /api/lectures/**, /api/auth/**, /api/health/**
