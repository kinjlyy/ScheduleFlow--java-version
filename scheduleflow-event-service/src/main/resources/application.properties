# =============================================================================
#  ScheduleFlow Event Service — Application Configuration
#  All values driven by environment variables with local defaults.
# =============================================================================

# ── Service Identity ───────────────────────────────────────────────────────────
spring.application.name=EVENT-SERVICE
server.port=${PORT:8083}

# ── Database Configuration ───────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway — Schema Migrations ─────────────────────────────────────────────────
# baseline-on-migrate: treat the pre-existing Hibernate schema as V1 baseline
# so Flyway does not try to re-create it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.scheduleflow.event=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}

# ── Service Discovery (Eureka Client) ──────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# Hostname-based registration for cloud/Render container routing
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:false}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_PORT:${PORT:8083}}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# ── Spring Boot Actuator ───────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}
management.info.app.name=ScheduleFlow Event Service
management.info.app.version=1.0.0
management.info.app.description=Microservice managing room reservations, academic events, and timetable impact

# ── OpenFeign Resilience & Timeouts ───────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT:10000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT:30000}
spring.cloud.openfeign.client.config.TIMETABLE-SERVICE.connect-timeout=10000
spring.cloud.openfeign.client.config.TIMETABLE-SERVICE.read-timeout=30000
spring.cloud.openfeign.client.config.default.logger-level=basic

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
