# =============================================================================
#  ScheduleFlow Eureka Server — Service Discovery Registry Configuration
# =============================================================================

spring.application.name=scheduleflow-eureka-server
server.port=${PORT:8761}

# ── Eureka Server Configuration ────────────────────────────────────────────────
# Standalone registry node — disable self-registration and registry fetching
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

# Eureka Server preservation and fast response cache eviction tuning
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:true}
eureka.server.eviction-interval-timer-in-ms=10000
eureka.server.response-cache-update-interval-ms=5000

# ── Spring Boot Actuator Configuration ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.app.name=ScheduleFlow Eureka Server
management.info.app.version=1.0.0
management.info.app.description=Eureka Service Registry for ScheduleFlow Microservices
