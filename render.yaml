databases:
  - name: scheduleflow-db
    databaseName: scheduleflow
    user: scheduleflow_user
    plan: free

services:
  - type: web
    name: scheduleflow-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: scheduleflow-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: scheduleflow-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: scheduleflow-db
          property: password
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        sync: false
        placeholder: "Enter your Vercel URL (e.g., https://your-app.vercel.app)"
      - key: JWT_SECRET
        sync: false
        placeholder: "Enter a random secure string"
